[project]
name = "autoqq-demo-reminder"
version = "0.1.0"
description = "Parameterized one-shot reminder publisher used to demo the AutoQQ provider chain"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
