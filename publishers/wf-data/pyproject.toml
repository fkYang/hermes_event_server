[project]
name = "autoqq-wfdata-publisher"
version = "0.1.1"
description = "Standalone Cetus bounty rotation publisher for AutoQQ EventServer"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
